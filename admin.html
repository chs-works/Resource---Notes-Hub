<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Resource Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">🔐 Resource Hub — Admin</div>
        <button class="theme-toggle" id="logoutBtn" type="button" style="display:none;">Log out</button>
    </nav>

    <main class="admin-main">

        <!-- LOGIN -->
        <section id="loginSection" class="admin-card login-card">
            <h2>Admin Login</h2>
            <p class="admin-hint">Log in with your admin email and password.</p>
            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="loginEmail" required autocomplete="username">
                <label>Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
                <button type="submit" class="admin-btn primary">Log In</button>
                <p id="loginError" class="admin-error"></p>
            </form>
        </section>

        <!-- DASHBOARD (hidden until logged in) -->
        <section id="dashboardSection" style="display:none;">

            <div class="admin-card">
                <h2>Add New Subject</h2>
                <form id="addSubjectForm" class="admin-form">
                    <label>Subject Name</label>
                    <input type="text" id="subjectName" required placeholder="e.g. Data Structures">

                    <label>Icon (emoji)</label>
                    <input type="text" id="subjectIcon" placeholder="📘" maxlength="4">

                    <label class="admin-checkbox">
                        <input type="checkbox" id="subjectDirect">
                        Direct resource list (like Timetable — files with no module/PDF split, just a flat list)
                    </label>

                    <label>Syllabus PDF (optional)</label>
                    <input type="file" id="subjectSyllabus" accept="application/pdf">

                    <button type="submit" class="admin-btn primary">Add Subject</button>
                    <p id="addSubjectStatus" class="admin-status"></p>
                </form>
            </div>

            <div class="admin-card">
                <h2>Subjects</h2>
                <p class="admin-hint">Click a subject to expand its modules, edit, or delete it.</p>
                <div id="subjectsList"></div>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
