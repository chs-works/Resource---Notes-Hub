<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Sem Notes Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/app-icon/logo-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/app-icon/logo-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/app-icon/logo-180.png">
    <meta name="theme-color" content="#7C6FE0">
</head>

<body>
    <nav class="navbar">
        <div class="menu-toggle" id="menuToggle">☰</div>
        <div class="nav-title">Notes Hub</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode"
            title="Switch to dark mode">🌙</button>
    </nav>

    <div class="side-menu" id="sideMenu">
        <div class="close-menu" id="closeMenu">✕</div>
        <a href="#" id="homeLink">🏠 Home</a>
        <a href="#" id="aboutLink">ℹ️ About</a>
        <a href="#" id="studyLink">📊 My Study</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdBfRMzsSuq6T0TeELkGljjl0BlaGLCOL-GqVWO8yKl15NRSg/viewform?usp=publish-editor"
            target="_blank">📩 Request a Resource</a>
        <a href="mailto:youremail@gmail.com">✉️ Contact / Feedback</a>
    </div>

    <div class="overlay" id="overlay"></div>

    <header>
        <img src="icons/books.png" width="100" height="100">
        <h1> Resource Hub</h1>
        <p>(for 3rd Sem)</p>
        <p>Quick access to notes, revision material, and videos</p>
    </header>

    <main>
        <div id="page-header"></div>
        <div id="subject-list"></div>
    </main>

    <!-- Supabase client library — must load before script.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- data.js is no longer used as the data source (script.js now fetches
         live from Supabase) — keep the file in the repo as a backup/reference
         if you like, just don't load it here. -->
    <script src="script.js"></script>
    <footer class="site-footer">
        <p>© 2026 Notes / Resource Hub — Built by CHS • All rights reserved</p>
    </footer>
</body>

</html>
